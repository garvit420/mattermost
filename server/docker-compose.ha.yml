version: '3'

services:
  # Load Balancer
  haproxy:
    image: nginx
    volumes:
      - ./build/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8065:8065"
    networks:
      - mm-test
    depends_on:
      - leader
      - follower
      - follower2
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8065/api/v4/system/ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Database (PostgreSQL with replication)
  postgres-primary:
    image: "postgres:13"
    restart: always
    networks:
      - mm-test
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mostest
      POSTGRES_DB: mattermost_test
    volumes:
     - "./build/docker/postgres.conf:/etc/postgresql/postgresql.conf"
     - "./data/postgres-primary:/var/lib/postgresql/data"
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf'
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 3

  postgres-replica:
    image: "postgres:13"
    restart: always
    networks:
      - mm-test
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mostest
      POSTGRES_DB: mattermost_test
    volumes:
     - "./build/docker/postgres.conf:/etc/postgresql/postgresql.conf"
     - "./build/docker/postgres-replica-setup.sh:/docker-entrypoint-initdb.d/postgres-replica-setup.sh"
     - "./data/postgres-replica:/var/lib/postgresql/data"
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf'
    depends_on:
      - postgres-primary
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 3

  # Database failover manager
  patroni:
    image: "bitnami/patroni:3.0.0"
    networks:
      - mm-test
    environment:
      PATRONI_SCOPE: mattermost
      PATRONI_NAME: patroni
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni:5432
      PATRONI_POSTGRESQL_DATA_DIR: /bitnami/postgresql/data
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni:8008
      PATRONI_ETCD_HOSTS: etcd:2379
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: postgres
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replicator
    depends_on:
      - postgres-primary
      - postgres-replica
      - etcd

  # Etcd for distributed coordination
  etcd:
    image: "bitnami/etcd:3.5.9"
    networks:
      - mm-test
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    volumes:
      - "./data/etcd:/bitnami/etcd"

  # Redis Cluster for Session and Pub/Sub
  redis-node-0:
    image: "redis:7.4.0"
    networks:
      - mm-test
    volumes:
      - "./data/redis-node-0:/data"
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --port 6379
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 3
      start_period: 10s

  redis-node-1:
    image: "redis:7.4.0"
    networks:
      - mm-test
    volumes:
      - "./data/redis-node-1:/data"
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --port 6379
    ports:
      - "6380:6379"
    depends_on:
      - redis-node-0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 3
      start_period: 10s

  redis-node-2:
    image: "redis:7.4.0"
    networks:
      - mm-test
    volumes:
      - "./data/redis-node-2:/data"
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --port 6379
    ports:
      - "6381:6379"
    depends_on:
      - redis-node-0
      - redis-node-1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 3
      start_period: 10s

  redis-cluster-init:
    image: "redis:7.4.0"
    networks:
      - mm-test
    depends_on:
      - redis-node-0
      - redis-node-1
      - redis-node-2
    volumes:
      - "./build/docker/redis-cluster-init.sh:/redis-cluster-init.sh"
    command: ["/bin/bash", "/redis-cluster-init.sh"]
    restart: on-failure

  # S3-compatible Object Storage
  minio:
    image: "minio/minio:RELEASE.2024-06-22T05-26-45Z"
    command: "server /data --console-address :9002"
    networks:
      - mm-test
    environment:
      MINIO_ROOT_USER: minioaccesskey
      MINIO_ROOT_PASSWORD: miniosecretkey
    volumes:
      - "./data/minio:/data"
    ports:
      - "9000:9000"
      - "9002:9002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: "ubuntu:22.04"
    networks:
      - mm-test
    depends_on:
      - minio
    volumes:
      - "./build/docker/minio-init.sh:/minio-init.sh"
    command: ["/bin/bash", "/minio-init.sh"]
    restart: on-failure

  # Mattermost Nodes
  leader:
    build:
      context: .
      dockerfile: ./build/Dockerfile.buildenv
    working_dir: '/home/mattermost-server/server'
    environment:
      - "MM_SQLSETTINGS_DRIVERNAME=postgres"
      - "MM_SQLSETTINGS_DATASOURCE=postgres://mmuser:mostest@postgres-primary/mattermost_test?sslmode=disable&connect_timeout=10"
      - "MM_CLUSTERSETTINGS_ENABLE=true"
      - "MM_CLUSTERSETTINGS_CLUSTERNAME=mm_ha_cluster"
      - "MM_CLUSTERSETTINGS_USEIPADDRESS=true"
      - "MM_CLUSTERSETTINGS_ENABLEEXPERIMENTALGOSSIPENCRYPTION=true"
      - "MM_CLUSTERSETTINGS_ENABLEGOSSIPCOMPRESSION=true"
      - "MM_LOGSETTINGS_FILELOCATION=./logs/leader"
      - "MM_LOGSETTINGS_ENABLECONSOLE=true"
      - "MM_LOGSETTINGS_CONSOLEJSON=true"
      - "MM_LOGSETTINGS_CONSOLELEVEL=INFO"
      - "MM_FILESETTINGS_DRIVERNAME=amazons3"
      - "MM_FILESETTINGS_AMAZONS3BUCKET=mattermost-uploads"
      - "MM_FILESETTINGS_AMAZONS3ENDPOINT=minio:9000"
      - "MM_FILESETTINGS_AMAZONS3SSL=false"
      - "MM_FILESETTINGS_AMAZONS3ACCESSKEYID=minioaccesskey"
      - "MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY=miniosecretkey"
      - "MM_REDISSETTINGS_ENABLE=true"
      - "MM_REDISSETTINGS_CLUSTERADDRESSES=redis-node-0:6379,redis-node-1:6379,redis-node-2:6379"
      - "MM_REDISSETTINGS_POOLTIMEOUTSECONDS=3"
      - "MM_REDISSETTINGS_CONNECTTIMEOUTMS=3000"
      - "MM_REDISSETTINGS_READTIMEOUTMS=3000"
      - "MM_REDISSETTINGS_WRITETIMEOUTMS=3000"
      - "MM_REDISSETTINGS_POOLSIZE=30"
      - "MM_NOTIFICATIONLOGSETTINGS_FILELOCATION=./logs/leader"
      - "MM_MESSAGEEXPORTSETTINGS_EXPORTFROMALLSERVERS=true"
      - "MM_METRICSSETTINGS_ENABLE=true"
      - "MM_METRICSSETTINGS_BLOCKLIST=process_start_time_seconds"
      - "MM_METRICSSETTINGS_LISTENADDRESS=:8067"
    networks:
      - mm-test
    depends_on:
      - postgres-primary
      - redis-node-0
      - redis-node-1
      - redis-node-2
      - redis-cluster-init
      - minio
      - minio-init
    volumes:
      - './../:/home/mattermost-server'
      - './../../enterprise:/home/enterprise'
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://leader:8065/api/v4/system/ping"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 1m
    user: ${CURRENT_UID}
    command: ['make', 'run-server']
    expose:
      - "8065"
      - "8067"
      - "8074/tcp"
      - "8074/udp"
      - "8075"

  follower:
    build:
      context: .
      dockerfile: ./build/Dockerfile.buildenv
    working_dir: '/home/mattermost-server/server'
    environment:
      - "MM_SQLSETTINGS_DRIVERNAME=postgres"
      - "MM_SQLSETTINGS_DATASOURCE=postgres://mmuser:mostest@postgres-primary/mattermost_test?sslmode=disable&connect_timeout=10"
      - "MM_CLUSTERSETTINGS_ENABLE=true"
      - "MM_CLUSTERSETTINGS_CLUSTERNAME=mm_ha_cluster"
      - "MM_CLUSTERSETTINGS_USEIPADDRESS=true"
      - "MM_CLUSTERSETTINGS_ENABLEEXPERIMENTALGOSSIPENCRYPTION=true"
      - "MM_CLUSTERSETTINGS_ENABLEGOSSIPCOMPRESSION=true"
      - "MM_LOGSETTINGS_FILELOCATION=./logs/follower"
      - "MM_LOGSETTINGS_ENABLECONSOLE=true"
      - "MM_LOGSETTINGS_CONSOLEJSON=true"
      - "MM_LOGSETTINGS_CONSOLELEVEL=INFO"
      - "MM_FILESETTINGS_DRIVERNAME=amazons3"
      - "MM_FILESETTINGS_AMAZONS3BUCKET=mattermost-uploads"
      - "MM_FILESETTINGS_AMAZONS3ENDPOINT=minio:9000"
      - "MM_FILESETTINGS_AMAZONS3SSL=false"
      - "MM_FILESETTINGS_AMAZONS3ACCESSKEYID=minioaccesskey"
      - "MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY=miniosecretkey"
      - "MM_REDISSETTINGS_ENABLE=true"
      - "MM_REDISSETTINGS_CLUSTERADDRESSES=redis-node-0:6379,redis-node-1:6379,redis-node-2:6379"
      - "MM_REDISSETTINGS_POOLTIMEOUTSECONDS=3"
      - "MM_REDISSETTINGS_CONNECTTIMEOUTMS=3000"
      - "MM_REDISSETTINGS_READTIMEOUTMS=3000"
      - "MM_REDISSETTINGS_WRITETIMEOUTMS=3000"
      - "MM_REDISSETTINGS_POOLSIZE=30"
      - "MM_NOTIFICATIONLOGSETTINGS_FILELOCATION=./logs/follower"
      - "MM_MESSAGEEXPORTSETTINGS_EXPORTFROMALLSERVERS=true"
      - "MM_METRICSSETTINGS_ENABLE=true"
      - "MM_METRICSSETTINGS_BLOCKLIST=process_start_time_seconds"
      - "MM_METRICSSETTINGS_LISTENADDRESS=:8067"
    networks:
      - mm-test
    depends_on:
      - leader
      - postgres-primary
      - redis-node-0
      - redis-node-1
      - redis-node-2
      - redis-cluster-init
      - minio
    volumes:
      - './../:/home/mattermost-server'
      - './../../enterprise:/home/enterprise'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://follower:8065/api/v4/system/ping"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 1m
    user: ${CURRENT_UID}
    command: ['make', 'run-server']
    restart: on-failure
    expose:
      - "8065"
      - "8067"
      - "8074/tcp"
      - "8074/udp"
      - "8075"

  follower2:
    build:
      context: .
      dockerfile: ./build/Dockerfile.buildenv
    working_dir: '/home/mattermost-server/server'
    environment:
      - "MM_SQLSETTINGS_DRIVERNAME=postgres"
      - "MM_SQLSETTINGS_DATASOURCE=postgres://mmuser:mostest@postgres-primary/mattermost_test?sslmode=disable&connect_timeout=10"
      - "MM_CLUSTERSETTINGS_ENABLE=true"
      - "MM_CLUSTERSETTINGS_CLUSTERNAME=mm_ha_cluster"
      - "MM_CLUSTERSETTINGS_USEIPADDRESS=true"
      - "MM_CLUSTERSETTINGS_ENABLEEXPERIMENTALGOSSIPENCRYPTION=true"
      - "MM_CLUSTERSETTINGS_ENABLEGOSSIPCOMPRESSION=true"
      - "MM_LOGSETTINGS_FILELOCATION=./logs/follower2"
      - "MM_LOGSETTINGS_ENABLECONSOLE=true"
      - "MM_LOGSETTINGS_CONSOLEJSON=true"
      - "MM_LOGSETTINGS_CONSOLELEVEL=INFO"
      - "MM_FILESETTINGS_DRIVERNAME=amazons3"
      - "MM_FILESETTINGS_AMAZONS3BUCKET=mattermost-uploads"
      - "MM_FILESETTINGS_AMAZONS3ENDPOINT=minio:9000"
      - "MM_FILESETTINGS_AMAZONS3SSL=false"
      - "MM_FILESETTINGS_AMAZONS3ACCESSKEYID=minioaccesskey"
      - "MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY=miniosecretkey"
      - "MM_REDISSETTINGS_ENABLE=true"
      - "MM_REDISSETTINGS_CLUSTERADDRESSES=redis-node-0:6379,redis-node-1:6379,redis-node-2:6379"
      - "MM_REDISSETTINGS_POOLTIMEOUTSECONDS=3"
      - "MM_REDISSETTINGS_CONNECTTIMEOUTMS=3000"
      - "MM_REDISSETTINGS_READTIMEOUTMS=3000"
      - "MM_REDISSETTINGS_WRITETIMEOUTMS=3000"
      - "MM_REDISSETTINGS_POOLSIZE=30"
      - "MM_NOTIFICATIONLOGSETTINGS_FILELOCATION=./logs/follower2"
      - "MM_MESSAGEEXPORTSETTINGS_EXPORTFROMALLSERVERS=true"
      - "MM_METRICSSETTINGS_ENABLE=true"
      - "MM_METRICSSETTINGS_BLOCKLIST=process_start_time_seconds"
      - "MM_METRICSSETTINGS_LISTENADDRESS=:8067"
    networks:
      - mm-test
    depends_on:
      - leader
      - postgres-primary
      - redis-node-0
      - redis-node-1
      - redis-node-2
      - redis-cluster-init
      - minio
    volumes:
      - './../:/home/mattermost-server'
      - './../../enterprise:/home/enterprise'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://follower2:8065/api/v4/system/ping"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 1m
    user: ${CURRENT_UID}
    command: ['make', 'run-server']
    restart: on-failure
    expose:
      - "8065"
      - "8067"
      - "8074/tcp"
      - "8074/udp"
      - "8075"

  # Monitoring services
  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ./build/docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./build/docker/alerts.yml:/etc/prometheus/alerts.yml
      - ./data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - 9090:9090
    networks:
      - mm-test
    restart: on-failure

  alertmanager:
    image: prom/alertmanager:v0.26.0
    volumes:
      - ./build/docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./data/alertmanager:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - 9093:9093
    networks:
      - mm-test
    restart: on-failure

  grafana:
    image: grafana/grafana:10.0.0
    depends_on:
      - prometheus
    ports:
      - 3000:3000
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./build/docker/grafana/provisioning:/etc/grafana/provisioning
      - ./build/docker/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    networks:
      - mm-test
    restart: on-failure

  redis-exporter:
    image: oliver006/redis_exporter:v1.56.0
    environment:
      - REDIS_ADDR=redis-node-0:6379,redis-node-1:6379,redis-node-2:6379
    networks:
      - mm-test
    restart: on-failure

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.14.0
    environment:
      - DATA_SOURCE_NAME=postgresql://mmuser:mostest@postgres-primary:5432/mattermost_test?sslmode=disable
    networks:
      - mm-test
    restart: on-failure

  node-exporter:
    image: prom/node-exporter:v1.6.1
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - mm-test
    restart: on-failure

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - mm-test
    restart: on-failure

networks:
  mm-test:
    driver: bridge 