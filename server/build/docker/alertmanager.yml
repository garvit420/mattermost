global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@example.com'
  smtp_auth_username: 'username'
  smtp_auth_password: 'password'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'slack-notifications'
  routes:
  - match:
      severity: critical
    receiver: 'slack-critical'
    continue: true
  - match:
      severity: warning
    receiver: 'slack-warnings'
    continue: true
  - match_re:
      service: ^(mattermost|redis|postgres)$
    receiver: 'team-db'

receivers:
- name: 'slack-notifications'
  slack_configs:
  - api_url: 'https://hooks.slack.com/services/REPLACE/WITH/YOUR_WEBHOOK'
    channel: '#mattermost-alerts'
    text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
    send_resolved: true

- name: 'slack-critical'
  slack_configs:
  - api_url: 'https://hooks.slack.com/services/REPLACE/WITH/YOUR_WEBHOOK'
    channel: '#mattermost-critical'
    text: "CRITICAL ALERT!\n{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
    send_resolved: true

- name: 'slack-warnings'
  slack_configs:
  - api_url: 'https://hooks.slack.com/services/REPLACE/WITH/YOUR_WEBHOOK'
    channel: '#mattermost-warnings'
    text: "WARNING!\n{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
    send_resolved: true

- name: 'team-db'
  email_configs:
  - to: 'db-team@example.com'
    send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance'] 